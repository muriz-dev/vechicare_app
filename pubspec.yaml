name: vechicare_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  auto_route: ^11.1.0
  get_it: ^9.2.1
  injectable: ^3.0.0
  carousel_slider: ^5.1.2
  syncfusion_flutter_charts: ^33.2.15
  syncfusion_flutter_gauges: ^33.2.15
  collection: ^1.19.1
  dicebear_core: ^10.3.0
  dicebear_styles: ^10.2.0
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  build_runner: ^2.15.0
  injectable_generator: ^3.1.0
  auto_route_generator: ^10.6.0

flutter:
  uses-material-design: true

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700

  assets:
    - assets/vehicle_telemetry.json